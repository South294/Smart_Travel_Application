services:
  mongodb:
    image: mongo:6
    container_name: smart-travel-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=smart_travel
    volumes:
      - smart_travel_data:/data/db
    networks:
      - smart-travel-net
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand({serverStatus:1}).ok' | mongosh localhost:27017/test --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: smart-travel-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB=smart_travel
      - SECRET_KEY=smart-travel-development-secret-change-before-production-2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - FRONTEND_ORIGIN=http://localhost:5500
      - ADMIN_EMAIL=admin@smarttravel.vn
      - ADMIN_PASSWORD=admin123
      - VNPAY_PAYMENT_URL=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - VNPAY_RETURN_URL=http://localhost:8000/api/payments/vnpay/return
      - PAYMENT_FRONTEND_URL=http://localhost:5500/checkout.html
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-3-flash-preview
    volumes:
      - ./src/backend:/app
      - /app/.venv
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - smart-travel-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: nginx:alpine
    container_name: smart-travel-frontend
    restart: unless-stopped
    ports:
      - "5500:80"
    volumes:
      - ./src/frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smart-travel-net

  seed:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: smart-travel-seed
    command: ["python", "seed_db.py"]
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB=smart_travel
      - ADMIN_EMAIL=admin@smarttravel.vn
      - ADMIN_PASSWORD=admin123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - smart-travel-net
    profiles:
      - seed

volumes:
  smart_travel_data:
    name: smart_travel_data

networks:
  smart-travel-net:
    driver: bridge
