<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Khám phá các địa điểm du lịch, quán ăn, khách sạn trên bản đồ tương tác SmartTravel. Tìm kiếm xung quanh vị trí của bạn.">
    <title>Bản đồ - SmartTravel</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages/map.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body class="map-page">

    <header class="header">
        <div class="container navbar">
            <a href="index.html" class="logo"><i class="bx bx-paper-plane"></i> SmartTravel</a>
            <button class="mobile-menu-btn" aria-label="Menu"><i class="bx bx-menu"></i></button>
            <nav class="nav-links">
                <a href="index.html" class="nav-link">Trang chủ</a>
                <a href="tours.html" class="nav-link">Tour du lịch</a>
                <a href="map.html" class="nav-link active">Bản đồ</a>
                <a href="promotions.html" class="nav-link">Khuyến mãi</a>
                <a href="guides.html" class="nav-link">Thuê HDV</a>
            </nav>
            <div class="nav-actions">
                <a href="auth.html" class="btn btn-outline">Đăng nhập</a>
                <a href="auth.html" class="btn btn-primary">Đăng ký</a>
            </div>
        </div>
    </header>

    <div class="map-container">
        <aside class="map-sidebar glass-panel" id="mapSidebar">
            <div class="sidebar-header">
                <h2 class="font-bold">Danh mục trải nghiệm</h2>
                <p class="text-muted text-sm" id="locationStatus">Chưa bật định vị</p>
            </div>

            <div class="category-tabs vertical" id="categoryTabs">
                <button class="map-tab active" data-category="all"><i class="bx bx-grid-alt"></i> Tất cả</button>
                <button class="map-tab" data-category="food"><i class="bx bx-restaurant"></i> Ăn uống</button>
                <button class="map-tab" data-category="culture"><i class="bx bx-landscape"></i> Tham quan văn hóa</button>
                <button class="map-tab" data-category="fun"><i class="bx bx-party"></i> Vui chơi</button>
            </div>

            <div class="search-input-wrap">
                <i class="bx bx-search"></i>
                <input type="text" class="form-control form-control-icon" placeholder="Tìm kiếm địa điểm..." id="mapSearchInput">
            </div>

            <div class="places-list" id="placesList"></div>
        </aside>

        <section class="map-detail">
            <div class="location-gate" id="locationGate">
                <div class="location-gate-icon"><i class="bx bx-current-location"></i></div>
                <div class="location-gate-body">
                    <h3 class="font-semibold" id="gateTitle">Cho phép dùng định vị</h3>
                    <p class="text-muted text-sm" id="gateDesc">Để gợi ý điểm ăn uống, tham quan văn hóa, vui chơi quanh bạn.</p>
                </div>
                <div class="location-gate-actions">
                    <button class="btn btn-outline btn-sm" id="btnSkipLocation">Bỏ qua</button>
                    <button class="btn btn-primary btn-sm" id="btnAllowLocation">Bật định vị</button>
                </div>
            </div>

            <div class="detail-card" id="placeDetail">
                <div class="detail-placeholder">
                    <i class="bx bx-map-alt"></i>
                    <p>Chọn một địa điểm để xem chi tiết.</p>
                </div>
            </div>
        </section>
    </div>

    <script src="js/main.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
