<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Khôi phục và đặt lại mật khẩu tài khoản SmartTravel an toàn, nhanh chóng.">
    <title>Đặt lại mật khẩu - SmartTravel</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages/auth.css">
    <link rel="stylesheet" href="css/pages/redesign.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body class="auth-page">
    <a href="index.html" class="back-home"><i class="bx bx-left-arrow-alt"></i> Quay lại trang chủ</a>

    <div class="auth-container" style="max-width: 480px; min-height: auto; padding: 40px 30px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); background: #ffffff;">
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="width: 56px; height: 56px; border-radius: 16px; background: rgba(37,99,235,0.1); color: #2563eb; display: inline-flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 12px;">
                <i class="bx bx-key"></i>
            </div>
            <h2 style="font-size: 24px; font-weight: 700; color: #1e293b; margin-bottom: 8px;">Quên mật khẩu?</h2>
            <p style="font-size: 14px; color: #64748b; line-height: 1.5;">Nhập địa chỉ email đã đăng ký và thiết lập mật khẩu mới cho tài khoản SmartTravel của bạn.</p>
        </div>

        <form id="reset-password-form">
            <div id="reset-alert" style="display: none; padding: 12px 16px; border-radius: 10px; font-size: 14px; margin-bottom: 18px; line-height: 1.4;"></div>

            <div class="form-group auth-field" style="margin-bottom: 16px;">
                <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Email tài khoản</label>
                <div class="input-with-icon">
                    <i class="bx bx-envelope"></i>
                    <input type="email" id="reset-email" class="form-control" placeholder="name@example.com" required>
                </div>
            </div>

            <div id="otp-step-group" style="display: none;">
                <div class="form-group auth-field" style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Mã xác thực OTP (6 số)</label>
                    <div class="input-with-icon">
                        <i class="bx bx-shield-quarter"></i>
                        <input type="text" id="reset-otp" class="form-control" placeholder="Ví dụ: 123456" maxlength="6" pattern="[0-9]{6}">
                    </div>
                </div>

                <div class="form-group auth-field" style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Mật khẩu mới</label>
                    <div class="input-with-icon">
                        <i class="bx bx-lock-alt"></i>
                        <input type="password" id="reset-new-password" class="form-control" placeholder="Tối thiểu 6 ký tự" minlength="6">
                    </div>
                </div>

                <div class="form-group auth-field" style="margin-bottom: 24px;">
                    <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Xác nhận mật khẩu mới</label>
                    <div class="input-with-icon">
                        <i class="bx bx-check-shield"></i>
                        <input type="password" id="reset-confirm-password" class="form-control" placeholder="Nhập lại mật khẩu mới" minlength="6">
                    </div>
                </div>
            </div>

            <button type="button" id="request-otp-btn" class="btn btn-primary w-full" style="padding: 12px; font-size: 15px; font-weight: 600; border-radius: 12px; margin-bottom: 10px;">
                Gửi mã xác thực OTP
            </button>

            <button type="submit" id="reset-submit-btn" class="btn btn-primary w-full" style="display: none; padding: 12px; font-size: 15px; font-weight: 600; border-radius: 12px;">
                Xác nhận đổi mật khẩu
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid #f1f5f9;">
            <a href="auth.html" style="font-size: 14px; color: #2563eb; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;">
                <i class="bx bx-arrow-back"></i> Quay lại trang Đăng nhập
            </a>
        </div>
    </div>

    <script>
        function getDeviceFingerprint() {
            var stored = sessionStorage.getItem('smart_travel_device_fingerprint');
            if (stored) return stored;
            var canvasData = '';
            try {
                var canvas = document.createElement('canvas');
                var ctx = canvas.getContext('2d');
                if (ctx) {
                    ctx.textBaseline = 'top';
                    ctx.font = '14px Arial';
                    ctx.fillStyle = '#2563eb';
                    ctx.fillRect(100, 1, 50, 20);
                    ctx.fillStyle = '#06b6d4';
                    ctx.fillText('SmartTravel2026', 2, 12);
                    canvasData = canvas.toDataURL();
                }
            } catch (e) {
                canvasData = 'canvas_na';
            }
            var rawStr = [
                navigator.userAgent || '',
                navigator.language || '',
                screen.colorDepth || '',
                (screen.width || '') + 'x' + (screen.height || ''),
                new Date().getTimezoneOffset(),
                navigator.hardwareConcurrency || '',
                canvasData.slice(-80)
            ].join('||');
            var hash = 0;
            for (var i = 0; i < rawStr.length; i++) {
                var charCode = rawStr.charCodeAt(i);
                hash = ((hash << 5) - hash) + charCode;
                hash = hash & hash;
            }
            var fp = 'dev_' + Math.abs(hash).toString(16) + '_' + (navigator.hardwareConcurrency || 4);
            sessionStorage.setItem('smart_travel_device_fingerprint', fp);
            return fp;
        }

        var form = document.getElementById('reset-password-form');
        var alertBox = document.getElementById('reset-alert');
        var requestOtpBtn = document.getElementById('request-otp-btn');
        var submitBtn = document.getElementById('reset-submit-btn');
        var otpGroup = document.getElementById('otp-step-group');
        var emailInput = document.getElementById('reset-email');
        var otpInput = document.getElementById('reset-otp');
        var newPassInput = document.getElementById('reset-new-password');
        var confirmPassInput = document.getElementById('reset-confirm-password');

        function showAlert(msg, isSuccess) {
            alertBox.style.display = 'block';
            alertBox.style.background = isSuccess ? '#f0fdf4' : '#fef2f2';
            alertBox.style.color = isSuccess ? '#16a34a' : '#dc2626';
            alertBox.style.border = isSuccess ? '1px solid #bbf7d0' : '1px solid #fecaca';
            alertBox.textContent = msg;
        }

        requestOtpBtn.addEventListener('click', async function() {
            var email = emailInput.value.trim();
            if (!email) {
                showAlert('Vui lòng nhập địa chỉ email của bạn.', false);
                emailInput.focus();
                return;
            }
            requestOtpBtn.disabled = true;
            requestOtpBtn.textContent = 'Đang gửi mã...';
            try {
                var apiBase = window.SMART_TRAVEL_API_URL || 'http://localhost:8000';
                var res = await fetch(apiBase + '/api/auth/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Device-Fingerprint': getDeviceFingerprint()
                    },
                    body: JSON.stringify({ email: email })
                });
                var data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || 'Không thể gửi mã xác thực');
                }
                var successMsg = data.message || 'Mã OTP đã được gửi đến email của bạn.';
                if (data.otp_demo) {
                    successMsg += ' (Mã OTP thử nghiệm: ' + data.otp_demo + ')';
                    otpInput.value = data.otp_demo;
                }
                showAlert(successMsg, true);
                otpGroup.style.display = 'block';
                submitBtn.style.display = 'block';
                requestOtpBtn.textContent = 'Gửi lại mã OTP';
                emailInput.readOnly = true;
                otpInput.required = true;
                newPassInput.required = true;
                confirmPassInput.required = true;
                otpInput.focus();
            } catch (err) {
                showAlert(err.message || 'Lỗi gửi yêu cầu, vui lòng thử lại.', false);
            } finally {
                requestOtpBtn.disabled = false;
            }
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            var email = emailInput.value.trim();
            var otp = otpInput.value.trim();
            var newPass = newPassInput.value;
            var confirmPass = confirmPassInput.value;

            if (!otp || otp.length !== 6) {
                showAlert('Mã OTP phải bao gồm đúng 6 chữ số.', false);
                otpInput.focus();
                return;
            }

            if (newPass !== confirmPass) {
                showAlert('Mật khẩu xác nhận không khớp. Vui lòng kiểm tra lại.', false);
                confirmPassInput.focus();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Đang xử lý...';

            try {
                var apiBase = window.SMART_TRAVEL_API_URL || 'http://localhost:8000';
                var res = await fetch(apiBase + '/api/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Device-Fingerprint': getDeviceFingerprint()
                    },
                    body: JSON.stringify({ email: email, otp: otp, new_password: newPass })
                });
                var data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || 'Không thể đặt lại mật khẩu');
                }

                showAlert(data.message || 'Đặt lại mật khẩu thành công! Đang chuyển hướng...', true);
                form.reset();

                setTimeout(function() {
                    window.location.href = 'auth.html';
                }, 2000);
            } catch (err) {
                showAlert(err.message || 'Có lỗi xảy ra, vui lòng thử lại.', false);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Xác nhận đổi mật khẩu';
            }
        });
    </script>
</body>
</html>
